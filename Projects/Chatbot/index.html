<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="chatbot-popup">

        <!-- HEADER -->
        <div class="chat-header">
            <div class="header-info">
                <img src="robot.png" class="header-avatar" alt="Bot">
                <h2 class="logo-txt">Chatbot</h2>
            </div>
            <button class="material-symbols-outlined">keyboard_arrow_down</button>
        </div>

        <!-- CHAT BODY -->
        <div class="chat-body">

            <!-- Bot Greeting -->
            <div class="message bot-message">
                <img src="robot.png" class="bot-avatar">

                <div class="message-text">
                    Hey there 👋 How can I assist you today?
                </div>
            </div>

        </div>

        <!-- FOOTER -->
        <div class="chat-footer">
             <div class="chat-input-area">

                <!-- Emoji Button -->
                <button class="emoji-btn">😊</button>

                <!-- Emoji Picker -->
                <div class="emoji-picker">
                    😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉  
                    😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜  
                    🤓 🤨 😐 😑 😶 😏 😒 🙄 😬 🤥  
                    😴 🤤 😪 😵 🤯 🤕 🤒 🤧 😷 🤢  
                    ❤️ 💛 💚 💙 💜 🤎 🖤 🤍  
                    👍 👎 👊 🤛 🤜 🤝 🙌 👏  
                </div>

            <textarea placeholder="Type a message..." class="message-input"></textarea>

            <button class="send-btn material-symbols-outlined">send</button>
        </div>
    </div>

    


    <script src="script.js"></script>
</body>
</html>
