<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Of The Day</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #bbc6fa;
            font-family: Arial, sans-serif;
        }

        .quote-box {
            background: #fff;
            width: 700px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 20px 0px rgba(0, 0, 0, 0.15);
        }

        .quote-box h2 {
            font-size: 32px;
            margin-bottom: 40px;
            position: relative;
        }

        .quote-box h2::after {
            content: '';
            width: 75px;
            height: 3px;
            background: rgb(23, 124, 229);
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        blockquote {
            font-size: 22px;
            min-height: 60px;
        }

        span {
            display: block;
            margin-top: 10px;
            float: right;
            position: relative;
            font-style: italic;
        }

        .quote-box div {
            width: 100%;
            margin-top: 50px;
            display: flex;
            justify-content: center;
        }

        .quote-box button {
            background: rgb(23, 124, 229);
            color: #fff;
            border-radius: 25px;
            border: 1px solid rgb(23, 124, 229);
            width: 150px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .quote-box button img {
            width: 20px;
            margin-right: 10px;
        }

        .quote-box button:nth-child(2) {
            background: transparent;
            color: #333;
            border: 1px solid #ccc;
        }

        .tweet-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background-color: #1da1f2;
            border: none;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tweet-btn:hover {
            background-color: #0d8ae5;
        }

        .tweet-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="quote-box">
        <h2>Quote Of The Day</h2>
        <blockquote id="quote">Loading...</blockquote>
        <span id="author">Loading...</span>
        <div>
            <button onclick="getQuote()">New Quote</button>
            <button class="tweet-btn" onclick="tweet()">
                <img src="twitter.png" alt="Twitter" class="tweet-icon">
                Tweet
            </button>
        </div>
    </div>

    <script src = 'author.js'></script>
    <script>
    
        const quote = document.getElementById('quote');
        const author = document.getElementById('author');

        function getQuote() {
            // pick a random quote from your array
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const q = quotes[randomIndex];
            quote.innerHTML = `"${q.content}"`;
            author.innerHTML = `– ${q.author}`;
        }

        function tweet() {
            const tweetText = `${quote.innerText} ${author.innerText}`;
            const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
            window.open(tweetUrl, "Tweet Window", "width=600, height=300");
        }

        // Load one quote when page opens
        getQuote();
    
</script>
</body>
</html>
