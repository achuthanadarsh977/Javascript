

<html>
    <head>
        <title>Javascript Functions</title>
    </head>
    <body bgcolor = "red">
        <h1><center><b>Javascript Functions</b></center></h1>
        <p>JavaScript functions are defined with the function keyword.You can use a function declaration or a function expression.</p>
        <p id="demo"></p>
        <script>

            

            function myfunction(a,b){
                return arguments.length
            }

            function addition(a,b){
                return a+b
            }

            function product(...args){
                let number = 1

                for(arg of args){
                    number*=arg
                }

                return number
            }

            const myfunction1 = new Function("a","b","return a-b")


            document.getElementById('demo').innerHTML = "The number of arguments in the given function:"+ myfunction(4,3) +"<br><br>"+"The sum of two numbers:" + addition(4,3)+
            "<br><br>"+"The difference of two numbers:"+myfunction1(12,9)+"<br><br>"+"The product of arguments:"+product(1,2,3,4,5,6,7)

          

        </script>
    </body>
</html>
